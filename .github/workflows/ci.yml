name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_GLOBAL_CACHE: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: yarn fmt:check
          - name: Lint
            command: yarn lint
          - name: Types
            command: yarn typecheck
          - name: Tests
            command: yarn test
          - name: Package
            command: yarn check:attw
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Yarn
        uses: yarnpkg/setup-action@c9778d0717d1b46cf29f06ae5ae5ad41c1bb1c1a

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Print versions
        run: |
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run check
        run: ${{ matrix.command }}
