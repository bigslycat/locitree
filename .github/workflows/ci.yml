name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      YARN_ENABLE_GLOBAL_CACHE: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: yarn fmt:check
          - name: Lint
            command: yarn lint
          - name: Types
            command: yarn typecheck
          - name: Tests
            command: yarn test --coverage
          - name: Package
            command: yarn check:attw
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Yarn
        uses: yarnpkg/setup-action@c9778d0717d1b46cf29f06ae5ae5ad41c1bb1c1a

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Print versions
        run: |
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run check
        run: ${{ matrix.command }}

      - name: Upload coverage
        if: >-
          ${{
            !cancelled()
            && matrix.name == 'Tests'
            && github.event_name == 'push'
            && github.ref_name == 'main'
          }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: coverage/cobertura-coverage.xml
          disable_search: true
          fail_ci_if_error: true

  publish:
    name: npm
    if: github.event_name == 'release' && github.event.release.prerelease == false
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: npm-publish-${{ github.event.release.tag_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      YARN_ENABLE_GLOBAL_CACHE: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Yarn
        uses: yarnpkg/setup-action@c9778d0717d1b46cf29f06ae5ae5ad41c1bb1c1a

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Verify release version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "::error::Release tag must be v$package_version, got $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --immutable

      - name: Publish with trusted publishing
        run: npm publish --provenance
